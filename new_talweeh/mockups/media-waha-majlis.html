<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Media · Majlis — Talweeh Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/waha-quran.css" />
<link rel="stylesheet" href="assets/waha-courses.css" />
<link rel="stylesheet" href="assets/waha-media.css" />
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('talweeh-waha-forest-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
/* ═══ Media · Variation D — Majlis (the watch page, /media/:slug) ═══
   One video, given the room: title over a green stage band, the framed player, previous /
   next within the topic, then the overview beside a card with the teacher, the topic, the
   course the excerpt comes from and Subscribe. "Continue watching" and "More from the
   course" close the page. */
.stageband{position:relative;margin-top:26px;padding:34px 34px 30px;border-radius:34px;background:url('../public/brand/talweeh-pattern-dark.png') repeat center/720px auto,linear-gradient(160deg,var(--g4),var(--g2) 70%);border:1px solid rgba(215,179,115,.35);box-shadow:var(--shadow)}
.stageband .top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.stageband .kicker{color:var(--gold)}
.stageband h1{color:var(--cream);font-size:clamp(28px,3.8vw,50px);max-width:24ch;margin-top:6px}
.stageband .by{color:rgba(243,232,211,.75);font-weight:600;margin-top:8px}
.stageband .pn{display:flex;gap:8px}
.stageband .vp{box-shadow:0 40px 90px rgba(0,0,0,.45)}
.stageband .foot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;margin-top:16px}
.stageband .vp-keys{color:rgba(243,232,211,.7);margin:0}
.stageband .vp-keys kbd{background:rgba(243,232,211,.08);border-color:rgba(215,179,115,.3);color:var(--cream)}
.upn{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:16px;background:rgba(243,232,211,.06);border:1px solid rgba(215,179,115,.25);color:var(--cream);max-width:420px;transition:border-color .3s}
.upn:hover{border-color:var(--gold)}
.upn img{width:92px;aspect-ratio:16/9;object-fit:cover;border-radius:9px}
.upn small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--gold)}
.upn strong{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px}
.body2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:30px;margin-top:40px;align-items:start}
.body2 h2{font-size:clamp(24px,2.6vw,32px);margin:4px 0 16px}
.aboutc{position:sticky;top:110px;border-radius:26px;padding:22px;display:grid;gap:16px}
.aboutc .kicker{color:var(--gold)}
.aboutc dl{display:grid;gap:12px}
.aboutc dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--c-mut)}
.aboutc dd{color:var(--c-head);font-weight:600;margin-top:2px}
.aboutc dd a{color:var(--gold-b)}
.aboutc .mcta{background:var(--c-in);border-color:var(--c-line)}
.aboutc .mcta strong{color:var(--c-head)}
.aboutc .copy{width:100%}
.aboutc .msub{justify-content:center}
.mgrid.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:1000px){.body2{grid-template-columns:1fr}.aboutc{position:static}.mgrid.three{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.stageband{padding:20px 14px}.mgrid.three{grid-template-columns:1fr}}
</style>
</head>
<body data-nav="Media" data-media="media-waha-riwaq.html">
<div class="mock-bar"><span>Media · Variation D — <b>Majlis</b> · the watch page for one video (/media/:slug) · pairs with any of the library designs</span><a href="index.html">← Back to all designs</a></div>
<div id="waha-top"></div>
<main><div class="wrap" id="page"></div></main>
<div id="waha-foot"></div>

<script src="assets/media-data.js"></script>
<script src="assets/courses-data.js"></script>
<script src="assets/waha-quran.js"></script>
<script src="assets/waha-courses.js"></script>
<script src="assets/waha-media.js"></script>
<script>
const { $, $$ } = Waha, M = WahaMedia, { esc } = M;
const params = new URLSearchParams(location.search);
const m = M.bySlug(params.get('v')) || M.MEDIA.find((x) => x.course) || M.MEDIA[0];
const cat = m.cats[0], topic = M.MEDIA.filter((x) => x.cats.includes(cat)), i = topic.indexOf(m);
const prev = topic[i - 1], next = topic[i + 1];
const fromCourse = m.course ? M.MEDIA.filter((x) => x !== m && x.course && x.course.slug === m.course.slug) : [];
const more = M.related(m, 6).filter((x) => !fromCourse.includes(x)).slice(0, 6);
document.title = `${m.title} — Talweeh Academy Media`;

$('#page').innerHTML = `
  <p class="crumbs"><a href="media-waha-riwaq.html">Media</a> / <a href="media-waha-riwaq.html?cat=${cat}">${esc(M.catLabel(cat))}</a> / ${esc(m.title)}</p>
  <section class="stageband">
    <div class="top">
      <div><span class="kicker">${esc(M.catLabel(cat))} · ${i + 1} of ${topic.length}</span><h1>${esc(m.title)}</h1><p class="by">${esc(m.speaker)}</p></div>
      <div class="pn">${prev ? `<a class="btn btn-glass btn-sm" href="${M.watchUrl(prev)}">‹ Previous</a>` : ''}${next ? `<a class="btn btn-g btn-sm" href="${M.watchUrl(next)}">Next ›</a>` : ''}</div>
    </div>
    <div id="player"></div>
    <div class="foot">
      <p class="vp-keys"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> 10 s · <kbd>&lt;</kbd><kbd>&gt;</kbd> speed · <kbd>F</kbd> full screen</p>
      ${next ? `<a class="upn" href="${M.watchUrl(next)}"><img src="${M.thumb(next.id)}" alt="" /><span><small>Up next in ${esc(M.catLabel(cat))}</small><strong>${esc(next.title)}</strong></span></a>` : ''}
    </div>
  </section>

  <section class="body2">
    <div>
      <span class="kicker">Overview</span><h2>About this video</h2>
      <div class="mov">${M.paras(m.overview)}</div>
    </div>
    <aside class="aboutc glass">
      <span class="kicker">In this majlis</span>
      <dl>
        <div><dt>Teacher</dt><dd>${esc(m.speaker)}</dd></div>
        <div><dt>Topic</dt><dd><a href="media-waha-riwaq.html?cat=${cat}">${esc(M.catLabel(cat))} →</a></dd></div>
        <div><dt>Full title on YouTube</dt><dd>${esc(m.full)}</dd></div>
      </dl>
      ${M.courseCta(m)}
      ${M.subscribe}
      <button class="btn btn-glass btn-sm copy" type="button" id="copy">Copy link to this video</button>
    </aside>
  </section>

  ${fromCourse.length ? `<section class="sec"><div class="sec-h"><div><span class="kicker">From ${esc(m.course.title)}</span><h2>More from this course</h2></div><a class="btn btn-glass btn-sm" href="${M.courseUrl(m.course)}">${m.course.free ? 'Watch the whole course →' : 'View the course →'}</a></div>
    <div class="mgrid three" data-stagger>${fromCourse.slice(0, 3).map((x) => M.card(x)).join('')}</div></section>` : ''}
  ${more.length ? `<section class="sec"><div class="sec-h"><div><span class="kicker">Continue watching</span><h2>More in ${esc(M.catLabel(cat))}</h2></div><a class="btn btn-glass btn-sm" href="media-waha-riwaq.html?cat=${cat}">All ${esc(M.catLabel(cat))} →</a></div>
    <div class="mgrid three" data-stagger>${more.map((x) => M.card(x)).join('')}</div></section>` : ''}`;

const player = new WahaCourses.WahaPlayer($('#player'), { onEnded: () => { if (next) location.href = M.watchUrl(next); } });
player.load(m.id, { title: m.title, kicker: m.speaker });
$('#copy').addEventListener('click', (e) => { navigator.clipboard?.writeText(location.href); e.target.textContent = '✓ Link copied'; setTimeout(() => (e.target.textContent = 'Copy link to this video'), 1600); });
Waha.reveal();
</script>
</body>
</html>
