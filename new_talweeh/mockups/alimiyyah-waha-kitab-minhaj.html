<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ʿĀlimiyyah · Kitāb + Minhāj — Talweeh Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/waha-quran.css" />
<link rel="stylesheet" href="assets/waha-courses.css" />
<link rel="stylesheet" href="assets/waha-alim.css" />
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('talweeh-waha-forest-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
/* ═══ ʿĀlimiyyah · Variation F — Kitāb + Minhāj ═══
   Kitāb's title page (smaller العالمية, no basmalah) and bound-volume curriculum, with Minhāj's
   mission and arched foundation cards (ʿIlm, ʿAmal, Discipline, Tazkiyah, Adab — unnumbered).
   The book is one fixed size for every year: the list of texts shrinks to fit a fuller year
   (and scrolls inside the page only as a last resort). Years, not abwāb. */
.tp{position:relative;margin-top:30px;padding:16px;border-radius:30px;background:var(--c-grad,var(--c-solid));box-shadow:var(--shadow)}
.tp-in{position:relative;border-radius:20px;padding:64px 30px 50px;text-align:center;background:var(--paper);color:var(--ink);border:1px solid rgba(184,137,76,.5);outline:1px solid rgba(184,137,76,.35);outline-offset:-10px}
.tp .t-ar{font-family:'Amiri',serif;font-size:clamp(50px,7vw,92px);line-height:1.35;color:var(--ink);direction:rtl}
.tp .rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px auto 16px;color:var(--p-gold)}
.tp .rule::before,.tp .rule::after{content:'';width:min(160px,22vw);height:1px;background:linear-gradient(90deg,transparent,var(--p-gold))}
.tp .rule::after{transform:scaleX(-1)}
.tp .kicker{margin-bottom:10px}
.tp h1{color:var(--ink);font-size:clamp(34px,4.6vw,60px);line-height:1.08}
.tp h1 em{display:block;font-style:italic;color:var(--p-gold);font-size:.6em;margin-top:8px}
.tp .lead{color:color-mix(in srgb,var(--ink) 72%,transparent);max-width:60ch;margin:16px auto 0;line-height:1.75;font-size:16.5px}
.tp .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 20px}
.tp .imprint{display:flex;gap:10px 28px;justify-content:center;flex-wrap:wrap;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:color-mix(in srgb,var(--ink) 60%,transparent)}
.tp .imprint b{color:var(--ink)}
.vol{margin-top:100px;scroll-margin-top:100px}
.vol .sec-h h2{font-size:clamp(32px,4vw,52px)}
.volw{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.fihris{position:sticky;top:110px;border-radius:26px;padding:20px 16px}
.fihris h3{color:var(--c-head);font-size:22px;padding:0 8px}
.fihris .ar{color:var(--gold);font-size:20px;padding:0 8px;text-align:left}
.fihris ol{list-style:none;margin-top:10px}
.fihris button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;width:100%;padding:9px 8px;border:0;border-radius:10px;background:none;color:var(--c-text);text-align:left;cursor:pointer;font-size:13.5px}
.fihris button:hover{background:var(--c-in)}
.fihris button.on{background:var(--c-hi);color:var(--gold-b)}
.fihris button b{font-family:'Lora',serif;color:var(--gold);width:22px}
.fihris button span{display:flex;gap:6px;min-width:0}
.fihris button span em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fihris button span::after{content:'';flex:1;border-bottom:1px dotted var(--c-line);transform:translateY(-4px);min-width:12px}
.fihris button i{font-style:normal;font-size:12px;color:var(--c-mut)}
.book{position:relative;perspective:2200px;margin:11px}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;border-radius:18px;background:var(--paper-2);box-shadow:var(--shadow),0 0 0 10px var(--c-solid),0 0 0 11px var(--c-line);height:680px}
/* the texts page: sizes scale with --s, which fit() lowers until a year's list fits the page */
.pg{--s:1;display:flex;flex-direction:column;overflow:hidden}
.pg .toc{gap:calc(9px * var(--s))}
.pg .toc li{font-size:calc(14.5px * var(--s))}
.pg .toc li b{font-size:calc(13px * var(--s))}
.pg .toc li small{font-size:calc(12px * var(--s))}
.pg .toc li .adisc{font-size:calc(10.5px * var(--s));padding:calc(2px * var(--s)) 8px}
.pg .tocw{flex:1;min-height:0;overflow:hidden}
.pg .tocw.scroll{overflow-y:auto;padding-right:6px}
/* Minhāj's foundations, without the 01–05 numbers */
.avalues .vi{display:none}
.avalues.arch article{padding-top:38px}
.spread::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:40px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.12) 45%,rgba(0,0,0,.18) 50%,rgba(0,0,0,.12) 55%,transparent);pointer-events:none}
.pg{position:relative;padding:40px 40px 56px;background:var(--paper);color:var(--ink)}
.pg:first-child{border-radius:18px 0 0 18px}
.pg:last-child{border-radius:0 18px 18px 0}
.pg .folio{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-family:'Lora',serif;font-size:13px;color:var(--p-gold)}
.pg .ar{font-size:34px;color:var(--p-gold);line-height:1.5;text-align:center}
.pg .kicker{text-align:center;display:block}
.pg h3{text-align:center;color:var(--ink);font-size:clamp(24px,2.4vw,32px);margin:8px 0 18px}
.pg .orn{text-align:center;color:var(--p-gold);letter-spacing:.6em;margin:0 0 18px}
.pg .intro{font-size:16px;line-height:1.9;color:color-mix(in srgb,var(--ink) 80%,transparent)}
.pg .intro::first-letter{float:left;font-family:'Lora',serif;font-size:58px;line-height:.9;padding:6px 8px 0 0;color:var(--p-gold)}
.pg .mix{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;justify-content:center}
.pg .mix span{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--fc);border:1px solid color-mix(in srgb,var(--fc) 40%,transparent)}
.pg h4{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--p-gold);text-align:center;margin-bottom:14px}
.toc{list-style:none;display:grid;gap:9px}
.toc li{display:grid;grid-template-columns:22px auto 1fr auto;gap:8px;align-items:baseline;font-size:14.5px}
.toc li b{font-family:'Lora',serif;color:var(--p-gold);font-size:13px}
.toc li strong{font-family:'Lora',serif;font-weight:600;color:var(--ink)}
.toc li::after{content:'';grid-column:3;grid-row:1;border-bottom:1px dotted color-mix(in srgb,var(--ink) 30%,transparent);transform:translateY(-4px)}
.toc li .adisc{grid-column:4;font-size:10.5px;padding:2px 8px}
.toc li small{grid-column:2/-1;font-size:12px;color:color-mix(in srgb,var(--ink) 58%,transparent);margin-top:-5px}
.turn{position:absolute;inset:0;pointer-events:none;transform-origin:left center;border-radius:0 18px 18px 0;background:var(--paper);left:50%;width:50%;backface-visibility:hidden;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.turn.go{animation:turn .7s var(--ease) forwards}
.turn.back{transform-origin:right center;left:0;border-radius:18px 0 0 18px;animation:turnb .7s var(--ease) forwards}
@keyframes turn{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes turnb{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.bnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:26px}
.bnav .vp-keys{margin:0}
@media (max-width:1000px){.spread{height:auto}.pg .tocw{overflow:visible}.volw{grid-template-columns:1fr}.fihris{position:static}.spread{grid-template-columns:1fr}.spread::after{display:none}.pg:first-child{border-radius:18px 18px 0 0}.pg:last-child{border-radius:0 0 18px 18px}.pg{padding:30px 22px 50px}.turn{display:none}}
</style>
</head>
<body data-nav="Alimiyyah" data-alim="alimiyyah-waha-kitab-minhaj.html">
<div class="mock-bar"><span>ʿĀlimiyyah · Variation F — <b>Kitāb + Minhāj</b> · Kitāb's title page and bound-volume curriculum (one fixed size for every year) with Minhāj's arched foundations</span><a href="index.html">← Back to all designs</a></div>
<div id="waha-top"></div>
<main><div class="wrap" id="page"></div></main>
<div id="waha-foot"></div>

<script src="assets/alimiyyah-data.js"></script>
<script src="assets/waha-quran.js"></script>
<script src="assets/waha-alim.js"></script>
<script>
const { $, $$ } = Waha, W = WahaAlim, { A, esc } = W;
let year = Math.min(10, Math.max(1, Number(new URLSearchParams(location.search).get("year")) || 1));
$('#page').innerHTML = `
  <section class="tp" data-r><div class="tp-in">
    <div class="t-ar">العَالِمِيَّة</div>
    <div class="rule">✦</div>
    <span class="kicker">Talweeh Academy · Online Seminary</span>
    <h1>Rooted in tradition.<em>Knowledge for a life of service.</em></h1>
    <p class="lead">A comprehensive, structured path through traditional Islamic education—designed for students balancing work, family, and the pursuit of sacred knowledge.</p>
    <div class="acts"><a class="btn btn-g" href="${A.APPLY}" target="_blank" rel="noreferrer">Apply to the seminary →</a><a class="btn btn-glass" href="#vol">Open the curriculum</a><a class="btn btn-line" href="${A.ENROL}">For enrollment</a></div>
    <div class="imprint">${W.facts.map(([k, v]) => `<span>${k} · <b>${v}</b></span>`).join('')}<span class="apill" style="letter-spacing:0;text-transform:none">Applications are open</span></div>
  </div></section>
  ${W.benefits()}
  ${W.mission()}
  ${W.values('arch')}
  <section class="vol" id="vol">
    <div class="sec-h"><div><span class="kicker">A structured journey through the Islamic sciences</span><h2>Explore your curriculum</h2></div><p>Explore the texts and subjects across Talweeh Academy’s ten-year part-time ʿĀlimiyyah curriculum — one page of the book for each year.</p></div>
    <div class="volw">
      <nav class="fihris glass" aria-label="Table of contents"><div class="ar">الفِهْرِس</div><h3>Contents</h3><ol id="toc">${A.YEARS.map((y) => `<li><button type="button" data-y="${y.n}"><b>${y.n}</b><span><em>${esc(y.subtitle)}</em></span><i>${y.subjects.length}</i></button></li>`).join('')}</ol></nav>
      <div>
        <div class="book"><div class="spread" id="spread"></div></div>
        <div class="bnav"><button class="btn btn-glass btn-sm" type="button" id="prev">‹ Previous year</button><p class="vp-keys"><kbd>←</kbd><kbd>→</kbd> turn the page</p><button class="btn btn-g btn-sm" type="button" id="next">Next year ›</button></div>
      </div>
    </div>
  </section>
  ${W.apply()}`;

function paint() {
  const y = A.YEARS[year - 1];
  const mix = A.FAMILIES.filter((f) => W.famCount(y, f.k));
  $('#spread').innerHTML = `
    <div class="pg"><div class="ar">${W.yearAr(y.n)}</div><span class="kicker">${y.label}</span><h3>${esc(y.subtitle)}</h3><div class="orn">✦ ✦ ✦</div><p class="intro">${esc(y.intro)}</p>
      <div class="mix">${mix.map((f) => `<span class="f-${f.k}">${esc(f.label)} · ${W.famCount(y, f.k)}</span>`).join('')}</div><span class="folio">— ${y.n * 2 - 1} —</span></div>
    <div class="pg"><h4>The texts of this year · ${y.subjects.length}</h4><div class="tocw"><ol class="toc">${y.subjects.map((s, i) => `<li class="f-${s.fam}"><b>${i + 1}</b><strong>${esc(s.t)}</strong><span class="adisc">${esc(s.disc)}</span>${s.d ? `<small>${esc(s.d)}</small>` : ''}</li>`).join('')}</ol></div><span class="folio">— ${y.n * 2} —</span></div>`;
  fit();
  $$('#toc button').forEach((b) => b.classList.toggle('on', Number(b.dataset.y) === year));
  $('#prev').disabled = year === 1; $('#next').disabled = year === 10;
}
// Shrink the list of texts (down to 72%) until it fits the fixed page; scroll inside it beyond that.
function fit() {
  const w = $('#spread .tocw'); if (!w) return;
  const pg = w.parentElement; w.classList.remove('scroll');
  let s = 1; pg.style.setProperty('--s', s);
  if (matchMedia('(max-width:1000px)').matches) return;
  while (w.scrollHeight > w.clientHeight + 1 && s > 0.72) { s = +(s - 0.04).toFixed(2); pg.style.setProperty('--s', s); }
  w.classList.toggle('scroll', w.scrollHeight > w.clientHeight + 1);
}
addEventListener('resize', fit);
document.fonts?.ready.then(fit);
function go(n) {
  if (n < 1 || n > 10 || n === year) return;
  const fwd = n > year, leaf = document.createElement('div');
  leaf.className = 'turn ' + (fwd ? 'go' : 'back');
  $('.book').appendChild(leaf); leaf.addEventListener('animationend', () => leaf.remove());
  setTimeout(() => { year = n; paint(); }, 260);
}
$('#toc').addEventListener('click', (e) => { const b = e.target.closest('[data-y]'); if (b) go(Number(b.dataset.y)); });
$('#prev').addEventListener('click', () => go(year - 1));
$('#next').addEventListener('click', () => go(year + 1));
addEventListener('keydown', (e) => {
  if (e.target !== document.body) return;
  const r = $('#vol').getBoundingClientRect(); if (r.top > innerHeight || r.bottom < 0) return;
  if (e.key === 'ArrowRight') go(year + 1); else if (e.key === 'ArrowLeft') go(year - 1);
});
paint(); Waha.reveal();
</script>
</body>
</html>
