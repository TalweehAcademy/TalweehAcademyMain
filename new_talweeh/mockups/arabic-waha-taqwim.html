<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arabic · Taqwīm — Talweeh Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/waha-quran.css" />
<link rel="stylesheet" href="assets/waha-courses.css" />
<link rel="stylesheet" href="assets/waha-arabic.css" />
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('talweeh-waha-forest-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
/* ═══ Arabic · Variation D — Taqwīm (the calendar) ═══
   The program as time: the welcome video large in the hero, then two years drawn as one
   proportional timeline (each module sized by its months, coloured by live / live + recorded)
   that pins while you scroll through the modules. Each module shows its books on a shelf, its
   weekly hours and format, then the full detail. Ends with how a week feels, and the fee. */
.th{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:34px;align-items:center;margin-top:36px}
.th .kicker{margin-bottom:6px}
.th h1{font-size:clamp(34px,4.2vw,56px);line-height:1.05;margin:4px 0 14px}
.th .lead{color:var(--p-mut);line-height:1.75}
.th .start{display:flex;align-items:center;gap:14px;margin:22px 0;padding:16px 18px;border-radius:20px}
.th .start .cal{width:62px;flex:none;border-radius:14px;overflow:hidden;text-align:center;background:var(--p-card);border:1px solid var(--c-line)}
.th .start .cal small{display:block;background:var(--gold);color:var(--g2);font-size:10.5px;font-weight:800;letter-spacing:.14em;padding:3px 0}
.th .start .cal b{display:block;font-family:'Lora',serif;font-size:22px;color:var(--p-head);padding:4px 0}
.th .start strong{display:block;color:var(--c-head);font-family:'Lora',serif;font-size:19px}
.th .start span{color:var(--c-mut);font-size:13.5px}
.th .acts{display:flex;gap:10px;flex-wrap:wrap}
.tl{position:sticky;top:96px;z-index:30;margin-top:80px;padding:14px 16px 16px;border-radius:24px}
.tl .tlrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.tl .tlrow strong{color:var(--c-head);font-family:'Lora',serif;font-size:17px}
.tl .legend{display:flex;gap:14px;font-size:12px;color:var(--c-mut)}
.tl .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tbar{position:relative;display:flex;gap:4px}
.tbar a{position:relative;flex:var(--m);min-width:70px;padding:10px 12px;border-radius:12px;color:var(--c-head);overflow:hidden;background:var(--c-in);border:1px solid var(--c-line);transition:border-color .3s}
.tbar a::before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:linear-gradient(90deg,rgba(215,179,115,.35),rgba(215,179,115,.18));transition:width .2s}
.tbar a > *{position:relative}
.tbar a small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--gold)}
.tbar a b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tbar a.live{box-shadow:inset 0 -3px 0 #4fc28a}.tbar a.mix{box-shadow:inset 0 -3px 0 var(--gold)}
.tbar a.on{border-color:var(--gold)}
.months{display:flex;justify-content:space-between;font-size:11px;color:var(--c-mut);margin-top:6px;padding:0 2px}
.chap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:34px;padding:70px 0 10px;scroll-margin-top:220px;border-bottom:1px solid var(--p-line)}
.chap .n{font-family:'Lora',serif;font-size:110px;line-height:.85;color:var(--p-gold);opacity:.9}
.chap h2{font-size:clamp(28px,3.2vw,40px);margin:10px 0 10px}
.chap .meta{display:flex;gap:8px;flex-wrap:wrap}
.chap .meta span{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--p-soft);border:1px solid var(--p-line);color:var(--p-mut)}
.chap .meta .live{color:#2f8f62;border-color:rgba(79,194,138,.4)}.chap .meta .mix{color:var(--p-gold);border-color:rgba(215,179,115,.5)}
.bshelf{display:flex;align-items:flex-end;gap:8px;height:240px;margin-top:26px;padding:0 14px;border-bottom:10px solid var(--c-solid);border-radius:0 0 6px 6px;position:relative}
.bshelf::after{content:'';position:absolute;left:-6px;right:-6px;bottom:-16px;height:6px;border-radius:0 0 8px 8px;background:rgba(0,0,0,.18)}
.book{position:relative;width:62px;height:var(--h);border-radius:5px 5px 2px 2px;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 20%,transparent 80%,rgba(0,0,0,.2)),var(--tc);color:#fff;display:flex;align-items:center;justify-content:center;cursor:default;transition:transform .35s var(--spring);box-shadow:0 8px 16px rgba(0,0,0,.18)}
.book:hover{transform:translateY(-10px)}
.book span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Lora',serif;font-size:13.5px;font-weight:600;line-height:1.15;max-height:calc(var(--h) - 40px);overflow:hidden;text-align:center}
.book i{position:absolute;left:8px;right:8px;height:2px;background:rgba(255,255,255,.45)}
.book i:nth-of-type(1){top:12px}.book i:nth-of-type(2){bottom:12px}
.book em{position:absolute;bottom:18px;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.06em;opacity:.85;writing-mode:initial}
.chap .ov{color:var(--p-text);line-height:1.8;margin-bottom:16px}
.chap .list{display:grid;gap:6px;margin-top:22px}
.week{margin-top:100px}
.week .sec-h h2{font-size:clamp(30px,3.6vw,46px)}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.wk article{padding:22px;border-radius:22px}
.wk .ic{font-family:'Amiri',serif;font-size:30px;color:var(--p-gold);line-height:1.3}
.wk h3{font-size:20px;margin:4px 0 8px}
.wk p{color:var(--p-mut);font-size:14px;line-height:1.65}
.feerow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;margin-top:40px;align-items:stretch}
.feebox{padding:28px;border-radius:26px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.feebox .kicker{color:var(--gold)}
.feebox b{font-family:'Lora',serif;font-size:60px;color:var(--gold-b);line-height:1}
.feebox p{color:var(--c-text)}
@media (max-width:1000px){.th,.chap,.feerow{grid-template-columns:1fr}.wk{grid-template-columns:1fr 1fr}.tl{top:84px}.tbar a b{display:none}.tbar a{min-width:0}}
</style>
</head>
<body data-nav="Arabic" data-arabic="arabic-waha-taqwim.html">
<div class="mock-bar"><span>Arabic · Variation D — <b>Taqwīm</b> · the welcome video large, then two years drawn as a pinned proportional timeline, each module's books on a shelf</span><a href="index.html">← Back to all designs</a></div>
<div id="waha-top"></div>
<main><div class="wrap" id="page"></div></main>
<div id="waha-foot"></div>

<script src="assets/arabic-data.js"></script>
<script src="assets/waha-quran.js"></script>
<script src="assets/waha-courses.js"></script>
<script src="assets/waha-arabic.js"></script>
<script>
const { $, $$ } = Waha, X = WahaArabic, { R, esc } = X;
// Module 5 has no month count ("final stage"): draw it as the remainder of the two years
const known = R.MODULES.reduce((n, m) => n + m.months, 0), rest = Math.max(3, 24 - known);
const MS = R.MODULES.map((m) => ({ ...m, span: m.months || rest }));
let acc = 0; MS.forEach((m) => { m.from = acc + 1; acc += m.span; m.to = acc; });
const cls = (m) => (m.format.includes('recorded') ? 'mix' : 'live');
$('#page').innerHTML = `
  <section class="th">
    <div data-r><div id="video"></div></div>
    <div>
      <span class="kicker" data-r>Talweeh Arabic · 2-Year Program</span>
      <h1 data-r>Unlock the Language of the Qur’an Beyond Translation</h1>
      <p class="lead" data-r>${esc(R.OBJ_INTRO.split('. ').slice(0, 2).join('. '))}.</p>
      <div class="start glass" data-r><div class="cal"><small>APR</small><b>2026</b></div><div><strong>Next cohort begins April 2026</strong><span>${esc(X.fact('Weekly commitment'))} a week · ${esc(X.fact('Format'))} · taught in ${esc(X.fact('Language of instruction'))}</span></div></div>
      <div class="acts" data-r>${X.member()}${X.calendar}</div>
    </div>
  </section>

  <div class="tl glass" id="tl">
    <div class="tlrow"><strong>Two years, five modules</strong><span class="legend"><span><i style="background:#4fc28a"></i>Primarily live</span><span><i style="background:var(--gold)"></i>Live + recorded</span></span></div>
    <div class="tbar" id="bar">${MS.map((m) => `<a href="#m${m.n}" class="${cls(m)}" data-m="${m.n}" style="--m:${m.span}"><small>M${m.n} · ${esc(m.duration)}</small><b>${esc(m.name)}</b></a>`).join('')}</div>
    <div class="months"><span>Start · April 2026</span><span>Year 1</span><span>Year 2</span><span>Completion</span></div>
  </div>

  ${MS.map((m) => { const hs = [230, 200, 215, 185]; return `
  <section class="chap" id="m${m.n}">
    <div>
      <span class="n">${m.n}</span>
      <span class="kicker">Module ${m.n} · ${m.months ? `months ${m.from}–${m.to}` : 'final stage'}</span>
      <h2>${esc(m.name)}</h2>
      <div class="meta"><span>${esc(m.duration)}</span><span class="${cls(m)}">${esc(m.format)}</span><span>${esc(m.hours)}</span></div>
      <div class="bshelf" aria-label="Texts studied">${m.texts.map((t, i) => `<div class="book t-${t.track}" style="--h:${hs[i % 4]}px" title="${esc(t.raw)}"><i></i><span>${esc(t.t)}</span><i></i></div>`).join('')}</div>
      <div class="list">${m.texts.map(X.textChip).join('')}</div>
    </div>
    <div><p class="ov">${esc(m.overview)}</p>${X.accordion(m.sections, { open: -1 })}</div>
  </section>`; }).join('')}

  <section class="week">
    <div class="sec-h"><div><span class="kicker">Applied learning</span><h2>How a week feels</h2></div><p>${esc(R.ABOUT[1].paragraphs[0].split('. ').slice(-1)[0])}</p></div>
    <div class="wk" data-stagger>
      <article class="card"><div class="ic">دَرْس</div><h3>Live classes</h3><p>Live sessions provide opportunities for clarification, discussion, and applied analysis, ensuring that learning remains interactive and accountable.</p></article>
      <article class="card"><div class="ic">حِوَار</div><h3>Weekly ḥiwār</h3><p>Weekly ḥiwār (conversation) sessions develop spoken fluency, focusing on everyday vocabulary and common structures.</p></article>
      <article class="card"><div class="ic">كِتَابَة</div><h3>Writing exercises</h3><p>Structured writing exercises reinforce grammatical accuracy and vocabulary retention.</p></article>
      <article class="card"><div class="ic">تَسْجِيل</div><h3>Recordings</h3><p>All live classes are recorded and uploaded to the Talweeh Student Portal, allowing students to review lessons at their convenience.</p></article>
    </div>
    <div class="feerow">
      <div class="feebox glass"><span class="kicker">Tuition</span><b>$99</b><p>USD per month · next cohort ${esc(X.fact('Next cohort'))}</p><div>${X.member()}</div></div>
      ${X.facts()}
    </div>
  </section>
  ${X.cta()}`;

X.player($('#video'), R.HERO.video.src.split('v=')[1], { title: 'About the 2-Year Arabic Program', kicker: 'Talweeh Arabic' });
// the pinned timeline fills as each module is read
const chaps = $$('.chap'), segs = $$('#bar a');
function onScroll() {
  const line = innerHeight * 0.45;
  chaps.forEach((c, i) => { const r = c.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (line - r.top) / r.height)); segs[i].style.setProperty('--p', p * 100 + '%'); segs[i].classList.toggle('on', r.top < line && r.bottom > line); });
}
addEventListener('scroll', onScroll, { passive: true }); onScroll();
X.bindAccordions(); Waha.reveal();
</script>
</body>
</html>
