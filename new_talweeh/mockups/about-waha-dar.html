<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>About · Dār — Talweeh Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/waha-quran.css" />
<link rel="stylesheet" href="assets/waha-courses.css" />
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('talweeh-waha-forest-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
/* ═══ About · Dār (the house) ═══
   The About menu's four pages as one house with four rooms: What is Talweeh (/about-us),
   Instructors (/instructors and /instructors/:slug), Contact (/contact-us) and Terms &
   Conditions (/p/terms-conditions). A green band carries the title and the four tabs; each tab
   has its own address (#talweeh, #instructors, #instructors/<slug>, #contact, #terms) so the
   About menu can link straight to it. All wording is the live pages'. */
.band{position:relative;margin-top:30px;padding:40px 34px 0;border-radius:34px;background:url('../public/brand/talweeh-pattern-dark.png') repeat center/720px auto,linear-gradient(160deg,var(--g4),var(--g2) 72%);border:1px solid rgba(215,179,115,.35);box-shadow:var(--shadow);color:var(--cream);overflow:hidden}
.band .top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.band .kicker{color:var(--gold)}
.band h1{color:var(--cream);font-size:clamp(36px,4.8vw,64px);line-height:1.04;margin-top:4px}
.band .sub{color:rgba(243,232,211,.75);max-width:58ch;line-height:1.7;margin-top:12px}
.band .seal{width:124px;height:124px;opacity:.95;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.tabs{display:flex;gap:4px;margin-top:30px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;display:flex;align-items:center;padding:14px 20px 16px;border-radius:18px 18px 0 0;color:rgba(243,232,211,.72);font-weight:700;font-size:14.5px;white-space:nowrap;transition:background .3s,color .3s}
.tabs a:hover{color:var(--cream);background:rgba(243,232,211,.05)}
.tabs a.on{background:var(--bg);color:var(--p-head)}
.room{padding-top:44px;animation:rin .5s var(--ease)}
@keyframes rin{from{opacity:0;transform:translateY(12px)}}
.blk{margin-top:90px}
.blk .sec-h h2,.h2{font-size:clamp(30px,3.8vw,46px)}
.lede{font-size:17px;line-height:1.85;color:var(--p-text)}

/* ── What is Talweeh ── */
.intro{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:center}
.intro h2{font-size:clamp(32px,4vw,52px);margin:6px 0 16px}
.intro p{font-size:17px;line-height:1.85;color:var(--p-text);margin-bottom:14px}
.frame{position:relative;padding:12px;border-radius:30px;background:var(--c-grad,var(--c-solid));box-shadow:var(--shadow)}
.frame img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:20px;border:1px solid rgba(215,179,115,.4)}
.frame .cap{position:absolute;left:28px;right:28px;bottom:28px;padding:14px 16px;border-radius:16px;background:rgba(10,24,17,.72);backdrop-filter:blur(8px);border:1px solid rgba(215,179,115,.3);color:var(--cream);font-size:13px}
.frame .cap b{display:block;font-family:'Lora',serif;font-size:18px;color:var(--gold-b);font-weight:600}
.sciences{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sci{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:16px 18px;border-radius:20px;background:var(--p-card);border:1px solid var(--p-line);transition:transform .35s var(--spring),border-color .3s}
.sci:hover{transform:translateY(-3px);border-color:var(--gold)}
.sci .a{grid-row:span 2;font-family:'Lora',serif;font-size:24px;color:var(--p-gold);line-height:1;min-width:40px}
.sci strong{font-family:'Lora',serif;font-size:17px;color:var(--p-head)}
.sci small{color:var(--p-mut);font-size:12.5px}
.proud{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pc{position:relative;padding:24px 22px;border-radius:26px;overflow:hidden;transition:transform .4s var(--spring)}
.pc:hover{transform:translateY(-5px)}
.pc .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--c-in);border:1px solid var(--c-line);color:var(--gold);margin-bottom:16px}
.pc .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pc h3{color:var(--c-head);font-size:21px;margin-bottom:6px}
.pc p{color:var(--c-mut);font-size:14px;line-height:1.6}
.pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.pl{display:flex;flex-direction:column;padding:28px 26px;border-radius:28px;background:var(--p-card);border:1px solid var(--p-line)}
.pl h3{font-size:24px;margin:4px 0 4px}
.pl .s{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--p-gold);margin-bottom:10px}
.pl p{color:var(--p-text);line-height:1.8;font-size:15px}
.pl.hi{background:var(--c-grad,var(--c-solid));border-color:var(--c-line)}
.pl.hi h3{color:var(--c-head)}.pl.hi p{color:var(--c-text)}.pl.hi .s{color:var(--gold)}
.meet{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mini{display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:var(--p-card);border:1px solid var(--p-line);transition:transform .4s var(--spring),border-color .3s}
.mini:hover{transform:translateY(-4px);border-color:var(--gold)}
.mini img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--p-soft)}
.mini span{padding:14px 16px}
.mini strong{display:block;font-family:'Lora',serif;font-size:17px;color:var(--p-head)}
.mini small{color:var(--p-mut);font-size:12.5px}
.ends{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:stretch}
.invite{padding:40px 36px;border-radius:32px;text-align:left;background:url('../public/brand/talweeh-pattern-dark.png') repeat center/720px auto,linear-gradient(150deg,var(--g4),var(--g2));border:1px solid rgba(215,179,115,.35);box-shadow:var(--shadow)}
.invite .kicker{color:var(--gold)}
.invite h2{color:var(--cream);font-size:clamp(28px,3.4vw,42px);margin:6px 0 12px}
.invite p{color:rgba(243,232,211,.8);line-height:1.8;margin-bottom:22px}
.invite .acts{display:flex;gap:10px;flex-wrap:wrap}
.tcard{display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:32px 30px;border-radius:32px;background:var(--paper,var(--p-card));border:1px solid var(--p-line)}
.tcard .sym{font-family:'Amiri',serif;font-size:40px;color:var(--p-gold);line-height:1}
.tcard h3{font-size:28px;margin:6px 0 6px}
.tcard p{color:var(--p-mut);line-height:1.7}

/* ── Instructors ── */
.ilist{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.ic2{display:grid;grid-template-columns:190px 1fr;border-radius:28px;overflow:hidden;background:var(--p-card);border:1px solid var(--p-line);transition:transform .4s var(--spring),border-color .3s,box-shadow .3s}
.ic2:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow)}
.ic2 .ph{position:relative;background:linear-gradient(160deg,var(--g4),var(--g2))}
.ic2 img{width:100%;height:100%;object-fit:cover;min-height:240px}
.ic2 .bd{display:flex;flex-direction:column;gap:8px;padding:22px 24px}
.ic2 .role{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--p-gold)}
.ic2 h3{font-size:26px}
.ic2 p{color:var(--p-text);line-height:1.7;font-size:15px}
.ic2 .go{margin-top:auto;font-weight:800;color:var(--p-gold);font-size:14px}
.bio{display:grid;grid-template-columns:320px minmax(0,1fr);gap:40px;align-items:start}
.bio aside{position:sticky;top:110px;display:grid;gap:14px}
.bio .port{padding:10px;border-radius:28px;background:var(--c-grad,var(--c-solid));box-shadow:var(--shadow)}
.bio .port img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:20px}
.bio .toc{border-radius:22px;padding:14px}
.bio .toc .kicker{color:var(--gold);padding:0 8px 6px}
.bio .toc a{display:flex;gap:10px;padding:8px;border-radius:10px;color:var(--c-text);font-size:13.5px;font-weight:600}
.bio .toc a:hover{background:var(--c-in);color:var(--gold-b)}
.bio .toc a b{font-family:'Lora',serif;color:var(--gold);width:18px}
.bio .role{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--p-gold)}
.bio h2{font-size:clamp(34px,4.4vw,56px);margin:6px 0 12px}
.bio .sum{font-family:'Lora',serif;font-style:italic;font-size:20px;line-height:1.6;color:var(--p-head);padding-left:18px;border-left:3px solid var(--gold);margin-bottom:30px}
.bio section{scroll-margin-top:110px;margin-bottom:30px}
.bio section h3{font-size:24px;margin-bottom:10px;display:flex;gap:12px;align-items:baseline}
.bio section h3 b{font-family:'Lora',serif;font-size:15px;color:var(--p-gold)}
.bio section p{font-size:16.5px;line-height:1.9;color:var(--p-text)}
.bnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:22px;border-top:1px solid var(--p-line)}
.back{display:inline-flex;margin-bottom:22px;font-weight:700;color:var(--p-gold)}

/* ── Contact ── */
.cwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.ccard{position:relative;display:flex;flex-direction:column;gap:12px;padding:34px 32px;border-radius:32px;overflow:hidden;transition:transform .4s var(--spring)}
.ccard:hover{transform:translateY(-4px)}
.ccard .ic{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:var(--c-in);border:1px solid var(--c-line);color:var(--gold)}
.ccard .ic svg{width:30px;height:30px;fill:currentColor}
.ccard h2{color:var(--c-head);font-size:clamp(26px,3vw,36px)}
.ccard p{color:var(--c-text);line-height:1.75;font-size:16px}
.ccard .v{font-family:'Lora',serif;font-size:clamp(19px,2vw,24px);color:var(--gold-b);word-break:break-all}
.ccard .btn{align-self:flex-start;margin-top:6px}
.also{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.also a{display:flex;flex-direction:column;gap:4px;padding:20px 22px;border-radius:22px;background:var(--p-card);border:1px solid var(--p-line);transition:border-color .3s,transform .35s var(--spring)}
.also a:hover{border-color:var(--gold);transform:translateY(-3px)}
.also small{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--p-gold)}
.also strong{font-family:'Lora',serif;font-size:18px;color:var(--p-head)}
.also span{color:var(--p-mut);font-size:13.5px}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.soc a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--p-card);border:1px solid var(--p-line);font-weight:700;font-size:13.5px;color:var(--p-head)}
.soc a:hover{border-color:var(--gold)}
.soc a[aria-disabled]{opacity:.45;pointer-events:none}

/* ── Terms ── */
.legal{display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px;align-items:start}
.legal nav{position:sticky;top:110px;border-radius:24px;padding:16px 12px;max-height:calc(100vh - 130px);overflow:auto}
.legal nav .kicker{color:var(--gold);padding:0 8px 8px}
.legal nav a{display:grid;grid-template-columns:24px 1fr;gap:6px;padding:7px 8px;border-radius:10px;color:var(--c-text);font-size:13px;line-height:1.4}
.legal nav a b{font-family:'Lora',serif;color:var(--gold)}
.legal nav a:hover{background:var(--c-in)}
.legal nav a.on{background:var(--c-hi);color:var(--gold-b)}
.doc{border-radius:30px;padding:42px 44px;background:var(--paper,var(--p-card));border:1px solid var(--p-line);color:var(--ink,var(--p-text))}
.doc .eff{display:inline-flex;gap:8px;padding:6px 14px;border-radius:999px;background:var(--p-soft);border:1px solid var(--p-line);font-size:12.5px;font-weight:700;color:var(--p-gold);margin-bottom:18px}
.doc .open p{font-size:16.5px;line-height:1.85;margin-bottom:12px}
.doc section{scroll-margin-top:110px;padding-top:28px;margin-top:28px;border-top:1px solid var(--p-line)}
.doc section h2{display:flex;gap:14px;align-items:baseline;font-size:clamp(22px,2.4vw,28px);margin-bottom:12px}
.doc section h2 b{font-family:'Lora',serif;font-size:15px;color:var(--p-gold);min-width:26px}
.doc p,.doc li{font-size:15.5px;line-height:1.8}
.doc p{margin-bottom:10px}
.doc :is(ul,ol){margin:6px 0 12px 22px;display:grid;gap:6px}
.doc :is(ul,ol) :is(ul,ol){margin-top:6px}
.doc li::marker{color:var(--p-gold)}
.doc strong{color:var(--p-head)}
.doc a{color:var(--p-gold);font-weight:700}
.ask{margin-top:34px;padding:28px;border-radius:24px;background:var(--c-grad,var(--c-solid));color:var(--c-text);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.ask .kicker{color:var(--gold)}
.ask h3{color:var(--c-head);font-size:26px;margin:4px 0 6px}
.ask p{color:var(--c-mut);margin:0}
.ask .acts{display:flex;gap:10px;flex-wrap:wrap}
.ask a.m{color:var(--gold-b);font-weight:700}

@media (max-width:1000px){.band .seal{width:84px;height:84px}.intro,.ends,.cwrap,.bio,.legal{grid-template-columns:1fr}.sciences{grid-template-columns:1fr 1fr}.proud,.meet{grid-template-columns:1fr 1fr}.ilist{grid-template-columns:1fr}.bio aside,.legal nav{position:static}.bio .port{max-width:320px}.also{grid-template-columns:1fr}}
@media (max-width:620px){.band{padding:28px 18px 0;border-radius:26px}.sciences,.pillars,.proud,.meet{grid-template-columns:1fr}.ic2{grid-template-columns:1fr}.ic2 img{min-height:0;aspect-ratio:4/3}.doc{padding:26px 20px}.tabs a{padding:12px 14px 14px;font-size:13.5px}}
</style>
</head>
<body data-nav="About">
<div class="mock-bar"><span>About · <b>Dār</b> · the About menu's four pages as tabs of one house: What is Talweeh, Instructors, Contact, Terms &amp; Conditions</span><a href="index.html">← Back to all designs</a></div>
<div id="waha-top"></div>
<main><div class="wrap" id="page"></div></main>
<div id="waha-foot"></div>

<script src="assets/about-data.js"></script>
<script src="assets/waha-quran.js"></script>
<script>
const { $, $$ } = Waha, D = window.ABOUT;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TABS = [
  { k: 'talweeh', label: 'What is Talweeh', title: 'About Talweeh Academy', sub: 'An institution dedicated to reviving Islamic academia in the West.' },
  { k: 'instructors', label: 'Instructors', title: 'Our Instructors', sub: 'Qualified scholars holding ijāzāt, teaching with clarity, depth and relevance.' },
  { k: 'contact', label: 'Contact', title: 'Contact Us', sub: 'Reach Talweeh Academy on Telegram or by email.' },
  { k: 'terms', label: 'Terms & Conditions', title: 'Terms & Conditions', sub: 'How access to and use of Talweeh Academy’s courses, services and content is governed.' },
];
const ICONS = [
  '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="m10 9 5 2.5-5 2.5z"/></svg>',
  '<svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M2.5 20c.5-3.5 2.8-5.5 5.5-5.5s5 2 5.5 5.5M14 15.2c3.2-.8 6.5.6 7.5 4.8"/></svg>',
  '<svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>',
];
const TG = '<svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.7.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.1l-4.8-1.5c-1-.3-1.1-1 .2-1.6L20.5 2.8c.9-.3 1.7.2 1.4 1.5z"/></svg>';
const MAIL = '<svg viewBox="0 0 24 24"><path d="M2 5h20v14H2V5zm2 2.4V17h16V7.4l-8 5.3-8-5.3zM19.2 7H4.8L12 11.8 19.2 7z"/></svg>';
const A = D.ABOUT, CT = D.CONTACT, T = D.TERMS, I = D.INSTRUCTORS;

function room(key, slug) {
  if (key === 'instructors') return slug ? bio(I.find((x) => x.slug === slug) || I[0]) : instructors();
  if (key === 'contact') return contact();
  if (key === 'terms') return terms();
  return talweeh();
}

function talweeh() {
  const sciences = A.subjects.map((s, i) => { const [name, rest] = s.split(' ('); return `<div class="sci"><span class="a">${String(i + 1).padStart(2, '0')}</span><strong>${esc(name)}</strong><small>${esc((rest || '').replace(/\)$/, ''))}</small></div>`; }).join('');
  return `
    <section class="intro">
      <div data-r><span class="kicker">Talweeh Academy</span><h2>${esc(A.intro.heading)}</h2><p>${esc(A.intro.para1)}</p><p>${esc(A.intro.para2)}</p></div>
      <figure class="frame" data-r><img src="${A.intro.imageUrl}" alt="" loading="lazy" /><figcaption class="cap"><b>Talweeh Academy</b>Reviving Islamic academia in the West</figcaption></figure>
    </section>
    <section class="blk"><div class="sec-h"><div><span class="kicker">Our curriculum</span><h2>The sciences we teach</h2></div><p>A carefully designed syllabus of robust, content-rich courses across every Islamic science.</p></div>
      <div class="sciences" data-stagger>${sciences}</div></section>
    <section class="blk"><div class="sec-h"><div><span class="kicker">${esc(A.proud.subheading)}</span><h2>${esc(A.proud.heading)}</h2></div></div>
      <div class="proud" data-stagger>${A.highlights.map((h, i) => `<article class="pc glass"><span class="ic">${ICONS[i % ICONS.length]}</span><h3>${esc(h.title)}</h3><p>${esc(h.description)}</p></article>`).join('')}</div></section>
    <section class="blk pillars" data-stagger>
      <article class="pl hi"><h3>${esc(A.vision.heading)}</h3><span class="s">Our vision</span><p>${esc(A.vision.text)}</p></article>
      <article class="pl"><h3>${esc(A.guidance.heading)}</h3><span class="s">${esc(A.guidance.subheading)}</span><p>${esc(A.guidance.text)}</p></article>
    </section>
    <section class="blk"><div class="sec-h"><div><span class="kicker">Qualified guidance</span><h2>Meet the instructors</h2></div><a class="btn btn-glass btn-sm" href="#instructors">All instructors →</a></div>
      <div class="meet" data-stagger>${I.map((x) => `<a class="mini" href="#instructors/${x.slug}"><img src="${x.image}" alt="${esc(x.name)}" loading="lazy" style="object-position:${x.imagePosition || 'center'}" /><span><strong>${esc(x.name)}</strong><small>${esc(x.role.replace(/^Instructor · /, ''))}</small></span></a>`).join('')}</div></section>
    <section class="blk ends">
      <div class="invite" data-r><span class="kicker">${esc(A.invitation.heading)}</span><h2>Raise the bar for Islamic education with us.</h2><p>${esc(A.invitation.text)}</p><div class="acts"><a class="btn btn-g" href="courses-waha-combined.html">Browse courses →</a><a class="btn btn-glass" href="#contact">Contact us</a></div></div>
      <a class="tcard" href="#terms" data-r><div><span class="sym">§</span><span class="kicker" style="margin-top:12px">Policies</span><h3>${esc(A.terms.heading)}</h3><p>Registration, course content, conduct, payments and refunds, and your privacy — effective ${esc(T.effective)}.</p></div><span class="btn btn-line btn-sm" style="align-self:flex-start">${esc(A.terms.buttonLabel)} →</span></a>
    </section>`;
}

function instructors() {
  return `
    <div class="sec-h"><div><span class="kicker">Qualified guidance · ${esc(A.guidance.subheading)}</span><h2 class="h2">Learn from scholars trained in the tradition</h2></div><p>${esc(A.guidance.text.split('. ')[0])}.</p></div>
    <div class="ilist" data-stagger>${I.map((x) => `<a class="ic2" href="#instructors/${x.slug}"><span class="ph"><img src="${x.image}" alt="${esc(x.name)}" loading="lazy" style="object-position:${x.imagePosition || 'center'}" /></span><span class="bd"><span class="role">${esc(x.role)}</span><h3>${esc(x.name)}</h3><p>${esc(x.summary)}</p><span class="go">Read full biography →</span></span></a>`).join('')}</div>`;
}

function bio(x) {
  const k = I.indexOf(x), prev = I[k - 1], next = I[k + 1];
  return `
    <a class="back" href="#instructors">← All instructors</a>
    <div class="bio">
      <aside><div class="port"><img src="${x.image}" alt="${esc(x.name)}" style="object-position:${x.imagePosition || 'center'}" /></div>
        <nav class="toc glass" aria-label="Biography sections"><span class="kicker">In this biography</span>${x.sections.map((s, i) => `<a href="#instructors/${x.slug}" data-sec="s${i}"><b>${i + 1}</b>${esc(i === 0 ? 'Early life & study' : s.title)}</a>`).join('')}</nav></aside>
      <article>
        <span class="role">${esc(x.role)}</span><h2>${esc(x.name)}</h2><p class="sum">${esc(x.summary)}</p>
        ${x.sections.map((s, i) => `<section id="s${i}"><h3><b>${String(i + 1).padStart(2, '0')}</b>${esc(i === 0 ? 'Early life & study' : s.title)}</h3><p>${esc(s.body)}</p></section>`).join('')}
        <div class="bnav">${prev ? `<a class="btn btn-glass btn-sm" href="#instructors/${prev.slug}">‹ ${esc(prev.name)}</a>` : '<span></span>'}${next ? `<a class="btn btn-g btn-sm" href="#instructors/${next.slug}">${esc(next.name)} ›</a>` : ''}</div>
      </article>
    </div>`;
}

function contact() {
  return `
    <div class="cwrap" data-stagger>
      <article class="ccard glass"><span class="ic">${TG}</span><span class="kicker">Telegram</span><h2>${esc(CT.telegram.heading)}</h2><p>${esc(CT.telegram.prefix)} <span class="v">${esc(CT.telegram.url.replace('https://', ''))}</span> ${esc(CT.telegram.suffix)}</p><a class="btn btn-g" href="${CT.telegram.url}" target="_blank" rel="noreferrer">Open Telegram →</a></article>
      <article class="ccard glass"><span class="ic">${MAIL}</span><span class="kicker">Email</span><h2>${esc(CT.email.heading)}</h2><p>${esc(CT.email.prefix)} <span class="v">${esc(CT.email.address)}</span> ${esc(CT.email.suffix)}</p><a class="btn btn-g" href="mailto:${CT.email.address}">Write to us →</a></article>
    </div>
    <div class="also" data-stagger>
      <a href="#terms"><small>Before you register</small><strong>Terms &amp; Conditions</strong><span>Payments, refunds and policies</span></a>
      <a href="#instructors"><small>Who teaches</small><strong>Our instructors</strong><span>Biographies and ijāzāt</span></a>
      <a href="#talweeh"><small>About us</small><strong>What is Talweeh</strong><span>Our mission and vision</span></a>
    </div>
    <div class="soc">${D.SOCIAL.map((s) => `<a href="${s.href}" ${/^https?:/.test(s.href) ? 'target="_blank" rel="noreferrer"' : 'aria-disabled="true"'}>${esc(s.label)}</a>`).join('')}</div>`;
}

function terms() {
  return `
    <div class="legal">
      <nav class="glass" id="ltoc" aria-label="Terms and Conditions contents"><span class="kicker">On this page</span>${T.sections.map((s) => `<a href="#terms" data-sec="t${s.n}"><b>${s.n}</b>${esc(s.title)}</a>`).join('')}<a href="#terms" data-sec="tq"><b>?</b>Contact Us</a></nav>
      <article class="doc">
        <span class="eff">Effective Date · ${esc(T.effective)}</span>
        <div class="open">${T.opening.map((p) => `<p>${p}</p>`).join('')}</div>
        ${T.sections.map((s) => `<section id="t${s.n}"><h2><b>${s.n}.</b>${esc(s.title)}</h2>${s.html}</section>`).join('')}
        <div class="ask" id="tq"><div><span class="kicker">Questions about these terms?</span><h3>Contact Us</h3><p>${T.contact} <a class="m" href="mailto:${T.email}">${T.email}</a></p></div><div class="acts"><a class="btn btn-g btn-sm" href="#contact">Contact Talweeh Academy →</a></div></div>
      </article>
    </div>`;
}

function render() {
  const [key0, slug] = location.hash.replace(/^#/, '').split('/');
  const key = TABS.some((t) => t.k === key0) ? key0 : 'talweeh';
  const t = TABS.find((x) => x.k === key);
  const person = key === 'instructors' && slug ? I.find((x) => x.slug === slug) : null;
  document.title = `${person ? person.name : t.title} — Talweeh Academy`;
  $('#page').innerHTML = `
    <section class="band">
      <div class="top"><img class="seal" src="../public/brand/talweeh-seal-gold.png" alt="Talweeh Academy" /><div><span class="kicker">About Talweeh Academy</span><h1>${esc(person ? person.name : t.title)}</h1><p class="sub">${esc(person ? person.role : t.sub)}</p></div></div>
      <nav class="tabs" aria-label="About Talweeh Academy">${TABS.map((x) => `<a href="#${x.k}" class="${x.k === key ? 'on' : ''}" ${x.k === key ? 'aria-current="page"' : ''}>${esc(x.label)}</a>`).join('')}</nav>
    </section>
    <div class="room">${room(key, slug)}</div>`;
  // in-page section links (biography and terms) scroll without changing the tab
  $$('[data-sec]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); document.getElementById(a.dataset.sec)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
  if (key === 'terms') watchToc();
  Waha.reveal();
}
// highlight the terms section being read
let tocObs;
function watchToc() {
  tocObs?.disconnect();
  tocObs = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) $$('#ltoc a').forEach((a) => a.classList.toggle('on', a.dataset.sec === e.target.id)); }), { rootMargin: '-30% 0px -60% 0px' });
  $$('.doc section, #tq').forEach((s) => tocObs.observe(s));
}
addEventListener('hashchange', () => { render(); window.scrollTo({ top: 0, behavior: 'instant' }); });
render();
</script>
</body>
</html>
